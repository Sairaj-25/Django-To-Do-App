{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">TO-DO<span class="text-success">APP</span></a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm rounded-3">
                <div class="card-header bg-warning text-dark p-3">
                    <h5 class="mb-0"><i class="fas fa-edit"></i> Edit Task</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label fw-bold">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" id="taskTitle" value="{{ task.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label fw-bold">Details</label>
                            <textarea class="form-control" id="taskDescription" rows="4" name="description">{{ task.description }}</textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="taskDueDate" class="form-label fw-bold">Due Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="taskDueDate" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}" required>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
